name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build & package, but do not create tag or GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: 'true'
      - name: Configure
        shell: pwsh
        run: |
          $env:Path = "$env:QT_ROOT_DIR\bin;" + $env:Path
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DQT_PATH="$env:QT_ROOT_DIR"
      - name: Build
        shell: pwsh
        run: |
          $env:Path = "$env:QT_ROOT_DIR\bin;" + $env:Path
          cmake --build build --parallel
      - name: Assemble Release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/Release | Out-Null
          $keep = @('CMakeCache.txt', 'cmake_install.cmake', 'Makefile', 'CMakeFiles', 'Release')
          Get-ChildItem build -Force | Where-Object { $_.Name -notin $keep } | Move-Item -Destination build/Release
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/Release
          retention-days: 1

  release:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build
          path: release
      - name: Add docs to payload
        shell: pwsh
        run: Copy-Item README.md, LICENSE release/
      - name: Check & parse version
        id: version
        shell: pwsh
        # CHANGELOG.md 顶部为版本单源；check_version.ps1 校验 src/appinfo.h 与 pkg.iss
        # 一致（不一致即失败），并输出 version=/tag= 供后续 7z/ISCC/tag/release 使用
        run: .\scripts\check_version.ps1 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: 7z portable package
        shell: pwsh
        run: 7z a "StickersManager_${{ steps.version.outputs.version }}.7z" ".\release\*"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc /DMyAppVersion="${{ steps.version.outputs.version }}" pkg.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }
      - name: Generate release notes
        shell: pwsh
        run: .\scripts\make_release_notes.ps1
      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" "StickersManager_${{ steps.version.outputs.version }}.exe" "StickersManager_${{ steps.version.outputs.version }}.7z" --title "${{ steps.version.outputs.tag }}" --notes-file release_notes.md